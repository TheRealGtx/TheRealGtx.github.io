<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rift CMS — Pannello Admin</title>
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
    <style>
      #back-to-site {
        position: fixed;
        top: 14px;
        right: 16px;
        z-index: 99999;
        background: #3d9be9;
        color: #fff;
        text-decoration: none;
        font-family: sans-serif;
        font-size: 13px;
        font-weight: 600;
        padding: 7px 14px;
        border-radius: 5px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.25);
        transition: background 0.2s;
      }
      #back-to-site:hover { background: #2a7abf; }
    </style>
  </head>
  <body>
    <a id="back-to-site" href="/">← Vai al sito</a>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
